
{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 text-center">
        <h1 class="display-4">Bienvenido al Sistema del Instituto</h1>
        <p class="lead">Sistema de gestión de alumnos y matrículas</p>
        
        {% if user.is_authenticated %}
            <div class="mt-4">
                <a href="{% url 'dashboard' %}" class="btn btn-primary btn-lg">Ir al Dashboard</a>
            </div>
        {% else %}
            <div class="mt-4">
                {% comment %} <a href="{% url 'login' %}" class="btn btn-primary btn-lg me-3">Iniciar Sesión</a> {% endcomment %}
                <a href="{% url 'register' %}" class="btn btn-outline-primary btn-lg">Registrarse</a>
            </div>
        {% endif %}
    </div>
</div>
{% endblock %}
